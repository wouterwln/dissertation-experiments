# T-Maze experiment parameters
tmaze:
  experiment:
    n_episodes: 1000
    max_steps: 4
    planning_horizon: 4
    receding_horizon: true
    n_optimization_steps: 1500
    learning_rate: 0.05
    seed: 18
    si_inference_horizon: 4
  convergence:
    curves:
      n_episodes: 20
      n_optimization_steps: 1500
      learning_rate: 0.05
      planning_horizon: 4
      max_steps: 4
      seed: 42
    lr_sweep:
      learning_rates: [0.001, 0.005, 0.01, 0.02, 0.05, 0.1]
      n_episodes: 20
      n_optimization_steps: 1500
      planning_horizon: 4
      max_steps: 4
      seed: 42
    budget:
      budgets: [10, 25, 50, 100, 250, 500, 1000, 1500, 2000]
      n_episodes: 20
      learning_rate: 0.05
      planning_horizon: 4
      max_steps: 4
      seed: 42
    variance:
      seeds: [42, 43, 44, 45, 46]
      n_episodes: 20
      n_optimization_steps: 1500
      learning_rate: 0.05
      planning_horizon: 4
      max_steps: 4
    policy_stability:
      budgets: [10, 25, 50, 100, 250, 500, 1000, 1500, 2000]
      learning_rate: 0.05
      planning_horizon: 4
      seed: 42
    scenario_curves:
      n_optimization_steps: 1500
      learning_rate: 0.05
      planning_horizon: 4
      seed: 42

# Epistemic Maze experiment parameters
epistemic_maze:
  n_episodes: 1000
  horizon: 3
  max_steps: 5
  receding_horizon: true
  n_optimization_steps: 1000
  learning_rate: 0.01
  seed: 42
  goal_temperature: 1.5
  cue_observation_accuracy: 1.0
  location_observation_accuracy: 1.0
  cue_cost_epsilon: 1.1
  n_theta: 2
  convergence:
    curves:
      n_episodes: 20
      n_optimization_steps: 2000
      learning_rate: 0.01
      seed: 42
    lr_sweep:
      learning_rates: [0.005, 0.01, 0.05, 0.1]
      n_episodes: 20
      n_optimization_steps: 2000
      seed: 42
    budget:
      budgets: [50, 100, 250, 500, 1000, 2000]
      n_episodes: 20
      learning_rate: 0.01
      seed: 42
    variance:
      seeds: [42, 43, 44, 45, 46]
      n_episodes: 20
      n_optimization_steps: 2000
      learning_rate: 0.01

# Color scheme (cool method family; entity-stable with the other chapters:
# active = AIF teal, marginal = BP violet-indigo, planning = VBP azure).
# Hexes mirror repo-root dissertation_theme.py (aif_mp / bp / vbp).
colors:
  active: "#3A6F73"    # AIF teal — mainline (epistemic priors)
  marginal: "#4A46A3"  # BP violet-indigo — plain-VFE / marginal baseline
  planning: "#2F97CE"  # VBP azure — priors + entropy correction
