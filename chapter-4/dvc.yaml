stages:
  tmaze_nuijten:
    cmd: >-
      uv run python scripts/tmaze/experiment.py
      --n-episodes ${tmaze.experiment.n_episodes}
      --max-steps ${tmaze.experiment.max_steps}
      --planning-horizon ${tmaze.experiment.planning_horizon}
      --planning-iterations ${tmaze.experiment.planning_iterations}
      --goal-temperature ${tmaze.experiment.goal_temperature}
      --receding-horizon
      --terminal-goal-only
      --seed ${tmaze.experiment.seed}
      --output-dir data/tmaze/nuijten
    deps:
      - scripts/tmaze/experiment.py
      - src/environments/tmaze.py
      - src/adapters
      - src/agents/nuijten_agent.py
      - src/inference
    params:
      - tmaze.experiment
    metrics:
      - data/tmaze/nuijten/stats.json:
          cache: false
    outs:
      - data/tmaze/nuijten/results.json

  stochastic_maze_nuijten:
    cmd: >-
      uv run python scripts/stochastic_maze/experiment.py
      --n-episodes ${stochastic_maze.experiment.n_episodes}
      --max-steps ${stochastic_maze.experiment.max_steps}
      --planning-horizon ${stochastic_maze.experiment.planning_horizon}
      --planning-iterations ${stochastic_maze.experiment.planning_iterations}
      --goal-temperature ${stochastic_maze.experiment.goal_temperature}
      --receding-horizon
      --seed ${stochastic_maze.experiment.seed}
      --output-dir data/stochastic_maze/nuijten
    deps:
      - scripts/stochastic_maze/experiment.py
      - src/environments/stochastic_maze.py
      - src/adapters
      - src/agents/nuijten_agent.py
      - src/inference
    params:
      - stochastic_maze.experiment
    metrics:
      - data/stochastic_maze/nuijten/stats.json:
          cache: false
    outs:
      - data/stochastic_maze/nuijten/results.json

  tmaze_bp_marginal:
    cmd: >-
      uv run python scripts/tmaze/experiment_bp.py
      --n-episodes ${tmaze.bp_marginal.n_episodes}
      --max-steps ${tmaze.bp_marginal.max_steps}
      --planning-horizon ${tmaze.bp_marginal.planning_horizon}
      --planning-iterations ${tmaze.bp_marginal.planning_iterations}
      --goal-temperature ${tmaze.bp_marginal.goal_temperature}
      --damping ${tmaze.bp_marginal.damping}
      --receding-horizon
      --no-terminal-goal-only
      --seed ${tmaze.bp_marginal.seed}
      --output-dir data/tmaze/bp_marginal
    deps:
      - scripts/tmaze/experiment_bp.py
      - src/environments/tmaze.py
      - src/adapters
      - src/agents/bp_marginal_agent.py
      - src/inference
    params:
      - tmaze.bp_marginal
    metrics:
      - data/tmaze/bp_marginal/stats.json:
          cache: false
    outs:
      - data/tmaze/bp_marginal/results.json

  stochastic_maze_bp_marginal:
    cmd: >-
      uv run python scripts/stochastic_maze/experiment_bp.py
      --n-episodes ${stochastic_maze.bp_marginal.n_episodes}
      --max-steps ${stochastic_maze.bp_marginal.max_steps}
      --planning-horizon ${stochastic_maze.bp_marginal.planning_horizon}
      --planning-iterations ${stochastic_maze.bp_marginal.planning_iterations}
      --goal-temperature ${stochastic_maze.bp_marginal.goal_temperature}
      --damping ${stochastic_maze.bp_marginal.damping}
      --receding-horizon
      --seed ${stochastic_maze.bp_marginal.seed}
      --output-dir data/stochastic_maze/bp_marginal
    deps:
      - scripts/stochastic_maze/experiment_bp.py
      - src/environments/stochastic_maze.py
      - src/adapters
      - src/agents/bp_marginal_agent.py
      - src/inference
    params:
      - stochastic_maze.bp_marginal
    metrics:
      - data/stochastic_maze/bp_marginal/stats.json:
          cache: false
    outs:
      - data/stochastic_maze/bp_marginal/results.json

  tmaze_convergence:
    cmd: >-
      uv run python scripts/convergence/run_convergence.py
      --environment tmaze
      --n-episodes ${convergence.tmaze.n_episodes}
      --max-steps ${convergence.tmaze.max_steps}
      --planning-horizon ${convergence.tmaze.planning_horizon}
      --n-iterations ${convergence.tmaze.n_iterations}
      --goal-temperature ${convergence.tmaze.goal_temperature}
      --seed ${convergence.tmaze.seed}
    deps:
      - scripts/convergence/run_convergence.py
      - src/environments/tmaze.py
      - src/adapters
      - src/inference
    params:
      - convergence.tmaze
    metrics:
      - data/tmaze/nuijten/convergence_stats.json:
          cache: false
    outs:
      - data/tmaze/nuijten/convergence.json

  stochastic_maze_convergence:
    cmd: >-
      uv run python scripts/convergence/run_convergence.py
      --environment stochastic_maze
      --n-episodes ${convergence.stochastic_maze.n_episodes}
      --max-steps ${convergence.stochastic_maze.max_steps}
      --planning-horizon ${convergence.stochastic_maze.planning_horizon}
      --n-iterations ${convergence.stochastic_maze.n_iterations}
      --goal-temperature ${convergence.stochastic_maze.goal_temperature}
      --seed ${convergence.stochastic_maze.seed}
    deps:
      - scripts/convergence/run_convergence.py
      - src/environments/stochastic_maze.py
      - src/adapters
      - src/inference
    params:
      - convergence.stochastic_maze
    metrics:
      - data/stochastic_maze/nuijten/convergence_stats.json:
          cache: false
    outs:
      - data/stochastic_maze/nuijten/convergence.json

  convergence_plots:
    cmd: >-
      uv run python scripts/convergence/plot_convergence.py
      --environments tmaze stochastic_maze
      --input-dir data
      --output-dir data/convergence_plots
      --format both
    deps:
      - scripts/convergence/plot_convergence.py
      - data/tmaze/nuijten/convergence.json
      - data/stochastic_maze/nuijten/convergence.json
    outs:
      - data/convergence_plots

  # Scaling study: Direct-prior MP (chapter 4) vs gradient VFE (chapter 3),
  # timed per planning call across horizon (T-Maze) and state-space size
  # (Stochastic Maze). Wall-clock metrics are machine-dependent (cache: false).
  scaling_mp:
    cmd: >-
      uv run python scripts/scaling/run_mp_and_export.py
      --horizons 2 3 4 5 6 8 10 12
      --grids 5 7 9 11 13
      --tmaze-iterations 20
      --stochastic-iterations 40
      --stochastic-horizon 10
      --repeats 5
      --out-dir data/scaling
    deps:
      - scripts/scaling/run_mp_and_export.py
      - src/adapters
      - src/inference
      - src/environments/tmaze.py
      - src/environments/stochastic_maze.py
    outs:
      - data/scaling/tensors
    metrics:
      - data/scaling/mp_timings.json:
          cache: false

  # Runs in chapter-3's env (has optax); times the gradient planners on the SAME
  # tensors exported by scaling_mp. Tracked deps stay in-repo; the cmd shells into
  # chapter-3 to use those planners + environment. T-Maze (horizon axis) is timed
  # with the FACTORIZED planner -- O((S*A*n_obs)^H), capped at H=5 since enumeration
  # is intractable beyond it; the Stochastic Maze (state-space axis) keeps the
  # TEMPORAL planner -- O(H*S^2).
  scaling_gradient:
    cmd: >-
      cd ../chapter-3 && uv run python scripts/scaling/run_gradient.py
      --tensors-dir ../chapter-4/data/scaling/tensors
      --mp-timings ../chapter-4/data/scaling/mp_timings.json
      --out ../chapter-4/data/scaling/gradient_timings.json
      --n-optimization-steps 2000
      --learning-rate 0.01
      --inference-mode planning
      --factorized-opt-steps 1500
      --factorized-lr 0.05
      --factorized-mode planning
      --factorized-max-horizon 5
      --repeats 3
    deps:
      - data/scaling/tensors
      - data/scaling/mp_timings.json
    metrics:
      - data/scaling/gradient_timings.json:
          cache: false

  scaling_plot:
    cmd: >-
      uv run python scripts/scaling/plot_scaling.py --data-dir data/scaling
    deps:
      - scripts/scaling/plot_scaling.py
      - data/scaling/mp_timings.json
      - data/scaling/gradient_timings.json
    outs:
      - data/scaling/scaling_horizon.png
      - data/scaling/scaling_horizon.pdf
      - data/scaling/scaling_state_space.png
      - data/scaling/scaling_state_space.pdf
    metrics:
      - data/scaling/scaling_summary.json:
          cache: false

  # Static figure of the Stochastic Maze layout (noise heatmap + cell types).
  stochastic_maze_env_plot:
    cmd: >-
      uv run python scripts/stochastic_maze/plot_environment.py
      --output-dir data/stochastic_maze/plots
      --format both
    deps:
      - scripts/stochastic_maze/plot_environment.py
      - scripts/stochastic_maze/maze_viz.py
      - src/environments/stochastic_maze.py
    outs:
      - data/stochastic_maze/plots/environment.pdf
      - data/stochastic_maze/plots/environment.png

  # Representative AIF trajectory. REUSES stochastic_maze_nuijten's results.json
  # (depends on it -> no re-simulation); only re-renders if the data/script change.
  stochastic_maze_trajectory_aif:
    cmd: >-
      uv run python scripts/stochastic_maze/plot_trajectory.py
      --results data/stochastic_maze/nuijten/results.json
      --label "${stochastic_maze.plots.aif_label}"
      --select ${stochastic_maze.plots.aif_select}
      --output data/stochastic_maze/plots/trajectory_aif
      --format both
    deps:
      - scripts/stochastic_maze/plot_trajectory.py
      - scripts/stochastic_maze/maze_viz.py
      - src/environments/stochastic_maze.py
      - data/stochastic_maze/nuijten/results.json
    params:
      - stochastic_maze.plots
    outs:
      - data/stochastic_maze/plots/trajectory_aif.pdf
      - data/stochastic_maze/plots/trajectory_aif.png

  # Representative BP trajectory. REUSES stochastic_maze_bp_marginal's results.json.
  stochastic_maze_trajectory_bp:
    cmd: >-
      uv run python scripts/stochastic_maze/plot_trajectory.py
      --results data/stochastic_maze/bp_marginal/results.json
      --label "${stochastic_maze.plots.bp_label}"
      --select ${stochastic_maze.plots.bp_select}
      --output data/stochastic_maze/plots/trajectory_bp
      --format both
    deps:
      - scripts/stochastic_maze/plot_trajectory.py
      - scripts/stochastic_maze/maze_viz.py
      - src/environments/stochastic_maze.py
      - data/stochastic_maze/bp_marginal/results.json
    params:
      - stochastic_maze.plots
    outs:
      - data/stochastic_maze/plots/trajectory_bp.pdf
      - data/stochastic_maze/plots/trajectory_bp.png
