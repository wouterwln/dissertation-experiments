# Chapter 4: Nuijten-MP planning in the chapter-3 epistemic environments
#
# These parameters are tuned for the Nuijten-MP planner (NOT the chapter-3 VFE
# defaults). Two findings drove the tuning:
#   1. A terminal-only goal lets the planner choose the epistemic cue detour, but
#      it commits to the goal only as the receding horizon shrinks to the exact
#      remaining distance -> receding_horizon must be true, with enough max_steps.
#   2. The chapter-3 cue-cost action prior (cue_cost_epsilon < 1) HURTS the MP
#      planner: it has its own epistemic drive, so biasing toward the cue makes it
#      loop. cue_cost_epsilon = 1.0 (uniform action prior) gives the best results.

tmaze:
  experiment:
    n_episodes: 1000
    max_steps: 5
    planning_horizon: 5
    planning_iterations: 20
    receding_horizon: true
    goal_temperature: 4.5
    terminal_goal_only: true
    seed: 42
  # Within-MP ablation: same region-graph machinery, epistemics OFF (canonical
  # undamped region-extended loopy BP, no EFE action prior). Per-step preference
  # factor (terminal_goal_only = false) -- the canonical KL-control objective and
  # the strongest goal signal the marginal planner can use. With no epistemic
  # drive it never seeks the cue (cue_visit_rate ~ 0): under the unresolved theta
  # the two arms are a perfect tie, so it commits to one and scores at chance,
  # vs Nuijten-MP's cue-then-arm 100%. damping = 1.0 is canonical loopy BP.
  bp_marginal:
    n_episodes: 1000
    max_steps: 5
    planning_horizon: 5
    planning_iterations: 20
    receding_horizon: true
    goal_temperature: 4.5
    terminal_goal_only: false
    damping: 1.0
    seed: 42

stochastic_maze:
  experiment:
    n_episodes: 1000
    max_steps: 10
    planning_horizon: 10
    planning_iterations: 40
    receding_horizon: true
    # 5x5 maze (biaslab/EFEasVFE config). Terminal goal (near-delta on the +1 state)
    # + receding horizon; the EFE ambiguity drive routes the agent along the
    # zero-observation-noise safe corridor (cols x=0 / x=4), avoiding the stochastic
    # interior entirely -> ~100% success. goal_temperature is the terminal-goal
    # precision (peak logit on the goal state).
    goal_temperature: 10.0
    seed: 42
  # Within-MP ablation: same region-graph machinery, epistemics OFF. Plans with
  # canonical (undamped) region-extended loopy BP instead of the Nuijten-MP EFE
  # action prior. Uses a per-step preference factor (terminal_goal_only = false) --
  # the canonical KL-control objective, and the *strongest* goal signal we can give
  # the marginal planner. A terminal-only goal (Nuijten's config) is deliberately
  # weak so the EFE drive can express the cue detour; without that drive the
  # marginal planner has nothing to act on and merely stalls, which is an
  # uninformative baseline. Given the strong per-step goal it still fails: with no
  # ambiguity drive it never commits to the safe corridor, oscillating into the
  # stochastic interior -> far below Nuijten-MP's ~100%.
  # damping = 1.0 is canonical loopy BP (no damping); it is not a tuned knob.
  bp_marginal:
    n_episodes: 1000
    max_steps: 10
    planning_horizon: 10
    planning_iterations: 40
    receding_horizon: true
    goal_temperature: 10.0
    terminal_goal_only: false
    damping: 1.0
    seed: 42

# Bethe Free Energy convergence study for the Nuijten-MP planner.
# Records a per-iteration BFE trace at every planning step (fixed horizon),
# across episodes, for each environment.
convergence:
  tmaze:
    n_episodes: 100
    max_steps: 4
    planning_horizon: 4
    n_iterations: 60
    goal_temperature: 4.5
    seed: 42
  stochastic_maze:
    n_episodes: 100
    max_steps: 10
    planning_horizon: 10
    n_iterations: 60
    goal_temperature: 10.0
    seed: 42
